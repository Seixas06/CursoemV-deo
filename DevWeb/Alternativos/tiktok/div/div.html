<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div</title>
    <style>
        body{
            background-color: rgb(4, 4, 58);
        }
        div{
            font-size: 25px;
            font-family: Arial, Helvetica, sans-serif;
            color: darkblue;
            background-color: cyan;
            padding: 10px;
            text-align: center;
            margin: auto;
            width: 80px;
            height: 80px;
            justify-content: center;
            align-items: center;
            display: flex;
            display: grid;
            place-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div>DIV</div>
</body>
</html>
