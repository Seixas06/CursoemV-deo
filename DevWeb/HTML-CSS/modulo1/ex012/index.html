<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML 5</title>
</head>
<body>
    <h1>Vídeos hospedados localmente</h1>
    <p>Este vídeos está hospedado no meu próprio servidor.</p>
    <video width="300" poster="midias/moneythumb.jpg" controls loop >
        <source src="midias/millionare.mp4" type="video/mp4">
        <source src="midias/millionare.webm" type="video/webm">
        Seu navegador não tem compatibilidade com reprodução de vídeos.
    </video>

    <h1>Inserindo vídeos do YouTube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/FdE5G95B7Mg?si=VR-x8wnL6lkvdDHp" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe> 
    <!--No Youtube você precisa ir em compartilhar e incorporar-->
</html>
