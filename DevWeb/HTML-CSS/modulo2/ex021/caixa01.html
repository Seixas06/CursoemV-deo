<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        /*
            display: block; transforma elementos inline em blocklevel
            display: inline; transforma elementos blocklevel em inline
            display: inline-block; torna elementos inline com características de bloco
        */

        h1{
            background-color: lightgray;
            height: 300px;
            width: 300px;

            border-width: 10px;
            border-style: solid;
            border-color: darkgray;

            border: 10px solid darkgray;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            padding: 10px;

            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 20px;
            margin-left: 10px;
            
            margin: 10px auto 40px auto;

            outline-width: 5px;
            outline-style: dashed;
            outline-color: rgb(8, 83, 83);
            
            outline: 5px dashed rgb(8,83,800);

        }
        a{
            border-width: 2px;
            border-style: solid;
            border-color: red;
            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemlos de box-level, mas os <a href="#">links são exemlos de caixas inline-level</a>. Vamos ver como tudo isso funciona</p>
</body>
</html>
