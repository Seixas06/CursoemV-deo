<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste</title>
    <style>
        body {
            background-color:antiquewhite;
            color:darkslateblue;
            font:normal 20pt arial;
        }
        h1{
            color:firebrick;
        }
    </style>
</head>
<body>
    <h1>Hello, world!</h1> 
    <h2>Tudo bem?</h2>
    <p>Primeiro código html</p>
    <script>
        var n1= Number.parseFloat(window.prompt('Digte um número: '))
        var n2= Number.parseFloat(window.prompt('Digite outro número: '))
        var soma=n1+n2
        window.alert(`A soma entre ${n1} e ${n2} é:  ${soma}`)
    </script>
</body>
</html>
